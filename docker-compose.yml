services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Test suite in Docker (no uv needed on the host). Never started by `docker compose up`.
  # No env_file on purpose: tests are keyless and isolated from .env (D44).
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    command: ["uv", "run", "--no-sync", "pytest"]

volumes:
  app-data:
